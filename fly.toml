# Đổi `app` thành tên global duy nhất (vd. thinh-chat-api-xyz) rồi: fly deploy
# Hoặc chạy: fly launch --copy-config (tạo app mới, giữ cấu hình dưới đây)

app = "chat-app-backend-qcvbng"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  # "off" = máy luôn chạy — Socket.IO và thông báo không bị trễ khi không có traffic (có thể tốn thêm quota).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
